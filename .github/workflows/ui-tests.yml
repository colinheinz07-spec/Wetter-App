name: Forecast and mobile layout tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['index.html', 'scripts/test-*.cjs', 'scripts/audit-models.py', '.github/workflows/ui-tests.yml']
  push:
    branches: [main]
    paths: ['index.html', 'scripts/test-*.cjs', 'scripts/audit-models.py', '.github/workflows/ui-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-forecast.cjs
      - run: python3 -m pip install numpy --break-system-packages
      - run: python3 scripts/test-native-temperature.py
      - run: python3 -m py_compile scripts/ingest-icon-temperature.py scripts/ingest-global-temperature.py scripts/native-temperature.py scripts/ingest-native-maps.py scripts/ingest-icon.py scripts/ingest-gfs.py scripts/ingest-ifs.py
      - run: python3 scripts/audit-models.py
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-mobile.cjs
