name: Forecast and mobile layout tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'scripts/test-*.cjs', '.github/workflows/ui-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-forecast.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-mobile.cjs
