name: Native point forecasts (hourly ICON)
on:
  workflow_dispatch:
  schedule:
    - cron: '35 2,5,8,11,14,17,20,23 * * *'
  push:
    branches: [main]
    paths: ['scripts/ingest-icon-points.py','scripts/native-point.py','.github/workflows/native-points.yml']
permissions:
  contents: write
concurrency:
  group: native-point-hourly
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        model: [icon-d2, icon-eu]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'eccodes>=2.42' numpy
      - name: Prepare generated-only snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ matrix.model }}
        run: |
          gh auth setup-git
          dir="$RUNNER_TEMP/native-points"
          mkdir -p "$dir"
          git -C "$dir" init
          git -C "$dir" remote add origin "https://github.com/${{ github.repository }}.git"
          ref="refs/heads/generated-points-$MODEL"
          old=$(git -C "$dir" ls-remote origin "$ref" | cut -f1)
          if [ -n "$old" ]; then
            git -C "$dir" fetch --depth=1 --filter=blob:none origin "$ref"
            test "$(git -C "$dir" show -s --format=%s FETCH_HEAD)" = "Generated hourly point snapshot $MODEL"
            test "$(git -C "$dir" show -s --format=%ae FETCH_HEAD)" = "41898282+github-actions[bot]@users.noreply.github.com"
            test -z "$(git -C "$dir" cat-file -p FETCH_HEAD | sed -n '/^parent /p')"
          fi
          printf '%s\n' "$old" > "$RUNNER_TEMP/point-old"
      - name: Create original-grid point tiles
        run: python scripts/ingest-icon-points.py --model '${{ matrix.model }}' --output "$RUNNER_TEMP/native-points"
      - name: Publish validated point tiles atomically
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ matrix.model }}
        run: |
          dir="$RUNNER_TEMP/native-points"
          ref="refs/heads/generated-points-$MODEL"
          old=$(< "$RUNNER_TEMP/point-old")
          test -s "$dir/point-index.json"
          test "$(du -sb "$dir" | cut -f1)" -lt 1500000000
          git -C "$dir" config user.name 'github-actions[bot]'
          git -C "$dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$dir" add -- '*.json.gz' point-index.json
          test ! -d "$dir/quick" || git -C "$dir" add quick
          if [ -d "$dir/anchor" ]; then git -C "$dir" add anchor; fi
          git -C "$dir" commit -m "Generated hourly point snapshot $MODEL"
          git -C "$dir" push --force-with-lease="$ref:$old" origin "HEAD:$ref"
