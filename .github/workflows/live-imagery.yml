name: DWD reflectivity and MTG satellite
on:
  workflow_dispatch:
  schedule:
    - cron: '03,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths: ['scripts/ingest-live-imagery.py', '.github/workflows/live-imagery.yml']
permissions:
  contents: write
concurrency:
  group: live-imagery
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-h5py python3-numpy python3-pil python3-pyproj
      - run: /usr/bin/python3 scripts/ingest-live-imagery.py
      - name: Publish imagery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live-imagery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh live radar reflectivity and satellite'
          git pull --rebase origin main
          git push origin HEAD:main
