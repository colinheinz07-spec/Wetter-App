name: DWD weather codes
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths: ['scripts/ingest-icon-weather.py', '.github/workflows/icon-weather.yml']
permissions:
  contents: write
concurrency:
  group: dwd-weather-codes
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-eccodes python3-numpy
      - run: /usr/bin/python3 scripts/ingest-icon-weather.py
      - name: Publish matching-run weather codes
        run: |
          if [ ! -f data/icon-weather.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/icon-weather.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update DWD weather codes'
          python3 scripts/push-data-commit.py
