name: Compact model transport
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/compress-models.py', '.github/workflows/compress-models.yml']
permissions:
  contents: write
concurrency:
  group: model-transport-compression
  cancel-in-progress: false
jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/compress-models.py
      - name: Publish compressed model snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh compact model transport'
          git pull --rebase origin main
          git push origin HEAD:main
