name: ICON-D2-RUC hail diameter
on:
  workflow_dispatch:
  schedule:
    - cron: '55 * * * *'
  push:
    branches: [main]
    paths: ['scripts/ingest-ruc-hail.py','scripts/native-point.py','.github/workflows/ruc-hail.yml']
permissions:
  contents: write
concurrency:
  group: ruc-hail-snapshot
  cancel-in-progress: false
jobs:
  hail:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'eccodes>=2.42' numpy scipy
      - name: Fetch and publish validated DWD hail snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          dir="$RUNNER_TEMP/ruc-hail"
          mkdir -p "$dir"
          git -C "$dir" init
          git -C "$dir" remote add origin "https://github.com/${{ github.repository }}.git"
          ref="refs/heads/generated-native-icon-d2-ruc"
          old=$(git -C "$dir" ls-remote origin "$ref" | cut -f1)
          args=()
          if [ -n "$old" ]; then
            git -C "$dir" fetch --depth=1 --filter=blob:none origin "$ref"
            test "$(git -C "$dir" show -s --format=%s FETCH_HEAD)" = 'Generated RUC hail snapshot'
            test "$(git -C "$dir" show -s --format=%ae FETCH_HEAD)" = '41898282+github-actions[bot]@users.noreply.github.com'
            test -z "$(git -C "$dir" cat-file -p FETCH_HEAD | sed -n '/^parent /p')"
            previous=$(git -C "$dir" show FETCH_HEAD:index.json | python -c 'import json,sys; print(json.load(sys.stdin)["run"])')
            args+=(--previous-run "$previous")
          fi
          python scripts/ingest-ruc-hail.py --output "$dir" "${args[@]}"
          if [ ! -s "$dir/index.json" ]; then exit 0; fi
          test "$(du -sb "$dir" | cut -f1)" -lt 150000000
          git -C "$dir" config user.name 'github-actions[bot]'
          git -C "$dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$dir" add -- '*.json.gz' index.json point-index.json
          git -C "$dir" commit -m 'Generated RUC hail snapshot'
          git -C "$dir" push --force-with-lease="$ref:$old" origin "HEAD:$ref"
