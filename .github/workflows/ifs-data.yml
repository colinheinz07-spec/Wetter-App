name: ECMWF IFS and AIFS forecast data
on:
  workflow_dispatch:
  schedule:
    - cron: '45 0,6,12,18 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/ifs-data.yml', 'scripts/ingest-ifs.py']
permissions:
  contents: write
concurrency:
  group: ifs-model-data
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        product: [ifs, ifs-short, aifs, aifs-ens-control]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'eccodes>=2.42' numpy
      - run: |
          if [ '${{ matrix.product }}' = 'ifs-short' ]; then python scripts/ingest-ifs.py --short; else python scripts/ingest-ifs.py --product '${{ matrix.product }}'; fi
      - run: python scripts/publish-model.py ${{ matrix.product }}
      - name: Publish complete ECMWF cycle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/${{ matrix.product }}.json data/${{ matrix.product }}.json.gz data/${{ matrix.product }}.meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update ECMWF ${{ matrix.product }} data'
          git pull --rebase origin main
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
