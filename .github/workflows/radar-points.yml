name: DWD quantitative local radar
on:
  workflow_dispatch:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  push:
    branches: [main]
    paths: ['scripts/ingest-radar-points.py', 'scripts/ingest-radar-nowcast.py', '.github/workflows/radar-points.yml']
permissions:
  contents: write
jobs:
  observation:
    concurrency:
      group: radar-ry
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ingest-radar-points.py
          sparse-checkout-cone-mode: false
      - run: sudo apt-get update && sudo apt-get install -y python3-h5py python3-numpy python3-pyproj
      - run: mkdir -p data && /usr/bin/python3 scripts/ingest-radar-points.py
      - name: Publish rolling RY observation independently of main and RV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ref=refs/heads/radar-observation-data
          previous=$(git ls-remote --heads origin "$ref" | cut -f1)
          if test -n "$previous"; then
            git fetch --depth=1 origin "$previous"
            test "$(git ls-tree -r --name-only "$previous")" = radar-points.json.gz
            test "$(git log -1 --format=%s "$previous")" = 'Generated DWD RY snapshot'
          fi
          blob=$(git hash-object -w data/radar-points.json.gz)
          if test -n "$previous" && test "$(git rev-parse "$previous:radar-points.json.gz")" = "$blob"; then exit 0; fi
          tree=$(printf '100644 blob %s\tradar-points.json.gz\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m 'Generated DWD RY snapshot')
          git push --force-with-lease="$ref:$previous" origin "$commit:$ref"
  forecast:
    concurrency:
      group: radar-rv
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ingest-radar-nowcast.py
          sparse-checkout-cone-mode: false
      - run: sudo apt-get update && sudo apt-get install -y python3-h5py python3-numpy python3-pyproj
      - run: mkdir -p data && /usr/bin/python3 scripts/ingest-radar-nowcast.py
      - name: Publish latest RV snapshot separately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ref=refs/heads/radar-nowcast-data
          previous=$(git ls-remote --heads origin "$ref" | cut -f1)
          if test -n "$previous"; then
            git fetch --depth=1 origin "$previous"
            test "$(git ls-tree -r --name-only "$previous")" = radar-nowcast.json.gz
            test "$(git log -1 --format=%s "$previous")" = 'Generated DWD RV snapshot'
          fi
          blob=$(git hash-object -w data/radar-nowcast.json.gz)
          if test -n "$previous" && test "$(git rev-parse "$previous:radar-nowcast.json.gz")" = "$blob"; then exit 0; fi
          tree=$(printf '100644 blob %s\tradar-nowcast.json.gz\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m 'Generated DWD RV snapshot')
          git push --force-with-lease="$ref:$previous" origin "$commit:$ref"
