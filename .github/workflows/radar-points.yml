name: DWD quantitative local radar
on:
  workflow_dispatch:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  push:
    branches: [main]
    paths: ['scripts/ingest-radar-points.py', 'scripts/ingest-radar-nowcast.py', '.github/workflows/radar-points.yml']
permissions:
  contents: write
concurrency:
  group: radar-points
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-h5py python3-numpy python3-pyproj
      - run: /usr/bin/python3 scripts/ingest-radar-points.py
      - run: /usr/bin/python3 scripts/ingest-radar-nowcast.py
        continue-on-error: true
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar-points.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh DWD quantitative radar raster'
          git pull --rebase origin main
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
      - name: Publish latest RV snapshot separately
        if: ${{ !cancelled() }}
        run: |
          test -f data/radar-nowcast.json.gz || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ref=refs/heads/radar-nowcast-data
          previous=$(git ls-remote --heads origin "$ref" | cut -f1)
          # Only replace snapshots produced by this step; never touch main or an
          # existing branch containing any unrelated content.
          if test -n "$previous"; then
            git fetch --depth=1 origin "$previous"
            test "$(git ls-tree -r --name-only "$previous")" = radar-nowcast.json.gz
            test "$(git log -1 --format=%s "$previous")" = 'Generated DWD RV snapshot'
          fi
          blob=$(git hash-object -w data/radar-nowcast.json.gz)
          if test -n "$previous" && test "$(git rev-parse "$previous:radar-nowcast.json.gz")" = "$blob"; then exit 0; fi
          tree=$(printf '100644 blob %s\tradar-nowcast.json.gz\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m 'Generated DWD RV snapshot')
          git push --force-with-lease="$ref:$previous" origin "$commit:$ref"
