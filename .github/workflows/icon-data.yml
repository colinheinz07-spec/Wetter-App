name: DWD model data (prototype)
on:
  workflow_dispatch:
  schedule:
    - cron: '40 2,5,8,11,14,17,20,23 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/icon-data.yml', 'scripts/ingest-icon.py', 'scripts/native-temperature.py', 'scripts/ingest-icon-temperature.py']
permissions:
  contents: write
concurrency:
  group: dwd-model-data
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: [icon-d2, icon-eu]
    steps:
      - uses: actions/checkout@v4
      - name: Install GRIB decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-eccodes python3-numpy
      - name: Import real DWD model grids
        run: /usr/bin/python3 scripts/ingest-icon.py --output data --models ${{ matrix.model }}
      - run: python3 scripts/publish-model.py ${{ matrix.model }}
      - name: Publish generated grids to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/${{ matrix.model }}.json data/${{ matrix.model }}.json.gz data/${{ matrix.model }}.meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update DWD model data"
          git pull --rebase origin main
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
      - name: Import original-grid temperature fields
        run: /usr/bin/python3 scripts/ingest-icon-temperature.py --model ${{ matrix.model }} --map
      - name: Publish original-grid temperature fields
        run: |
          git add data/${{ matrix.model }}-map-temperature
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh original-grid ${{ matrix.model }} temperature'
          git pull --rebase origin main
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
