name: ICON hourly surface forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2,5,8,11,14,17,20,23 * * *'
  push:
    branches: [main]
    paths: ['scripts/ingest-icon-hourly.py', 'scripts/ingest-icon-temperature.py', 'scripts/ingest-icon.py', 'scripts/native-temperature.py', '.github/workflows/icon-hourly.yml']
permissions:
  contents: write
concurrency:
  group: icon-hourly-surface
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: [icon-d2, icon-eu]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-eccodes python3-numpy
      - run: /usr/bin/python3 scripts/ingest-icon-hourly.py --model ${{ matrix.model }}
      - run: python3 scripts/publish-model.py ${{ matrix.model }}-hourly
      - name: Publish hourly forecast packets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/${{ matrix.model }}-hourly.json.gz data/${{ matrix.model }}-hourly.meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh hourly ICON surface forecasts'
          git pull --rebase origin main
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
      - name: Original ICON temperature tiles
        run: /usr/bin/python3 scripts/ingest-icon-temperature.py --model ${{ matrix.model }}
      - name: Publish original-grid temperatures
        run: |
          git add data/${{ matrix.model }}-temperature
          if [ -d data/${{ matrix.model }}-anchor-temperature ]; then git add data/${{ matrix.model }}-anchor-temperature; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh original-grid hourly ICON temperatures'
          git pull --rebase origin main
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
